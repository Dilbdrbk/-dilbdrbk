<figure class="chart">
  <p class="chart-title">The Knowledge Graph in numbers</p>
  <ol class="kg-timeline">
    <li><time>May 2012</time><strong>500M+ objects, 3.5B+ facts</strong><span>Google launches the Knowledge Graph from public sources such as Freebase and Wikipedia.</span></li>
    <li><time>Dec 2012</time><strong>570M entities, 18B facts</strong><span>The size Google reported seven months after launch.</span></li>
    <li><time>2014</time><strong>1.6B candidate facts</strong><span>Knowledge Vault research extracts facts from web pages.</span></li>
    <li><time>Mar 2015</time><strong>3B+ facts, almost 50M entities</strong><span>Freebase turns read-only, and its data moves to Wikidata.</span></li>
    <li><time>2020</time><strong>500B facts, 5B entities</strong><span>The latest size Google has published.</span></li>
  </ol>
  <figcaption>Sources: Google (2012, 2020), Dong et al. (2014), Pellissier Tanon et al. (2016).</figcaption>
</figure>
